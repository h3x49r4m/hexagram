</div><script>
(function() {
    
    var rawAbc = "\nX: 1\nT: Nokia Tune\nM: 3/4\nL: 1/8\nK: Amaj\n|: e'd' f2 g2 | c'b d2 e2 | ba c2 e2 | a6 :|\n";
    var abcNotation = rawAbc.split('\n')
        .filter(function(line) { return line.trim() !== ''; })
        .join('\n')
        .trim();
    
    var elementId = 'abc-0';
    var audioId = 'audio-abc-0';
    var retryCount = 0;
    var maxRetries = 10;

    
    function MyCursorControl(rootSelector) {
        var self = this;
        self.rootSelector = rootSelector;

        self.onStart = function() {};
        self.onEvent = function(ev) {
            var lastSelection = document.querySelectorAll(self.rootSelector + " .abcjs-highlight");
            for (var k = 0; k < lastSelection.length; k++) {
                lastSelection[k].classList.remove("abcjs-highlight");
            }

            if (ev && ev.elements) {
                for (var i = 0; i < ev.elements.length; i++) {
                    var note = ev.elements[i];
                    if (Array.isArray(note)) {
                        for (var j = 0; j < note.length; j++) {
                            note[j].classList.add("abcjs-highlight");
                        }
                    } else {
                        note.classList.add("abcjs-highlight");
                    }
                }
            }
        };

        self.onFinished = function() {
            var lastSelection = document.querySelectorAll(self.rootSelector + " .abcjs-highlight");
            for (var k = 0; k < lastSelection.length; k++) {
                lastSelection[k].classList.remove("abcjs-highlight");
            }
        };

        self.onBeat = function(beatNumber, totalBeats, totalTime, position) {};
        self.onLineEnd = function() {};
    }

    function loadABCJS() {
        return new Promise(function(resolve, reject) {
            
            if (typeof ABCJS !== 'undefined' && ABCJS.renderAbc) {
                resolve();
                return;
            }

            
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdn.jsdelivr.net/npm/abcjs@6.4.1/abcjs-audio.css';
            document.head.appendChild(link);

            
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/abcjs@6.4.1/dist/abcjs-basic-min.js';
            script.async = true;
            
            script.onload = function() {
                
                if (typeof ABCJS !== 'undefined' && ABCJS.renderAbc) {
                    resolve();
                } else {
                    reject(new Error('ABCJS loaded but not available'));
                }
            };
            
            script.onerror = function() {
                reject(new Error('Failed to load ABCJS from CDN'));
            };
            
            document.head.appendChild(script);
        });
    }

    function initAbcNotation() {
        loadABCJS()
            .then(function() {
                console.log('ABCJS loaded successfully');
                renderNotation();
            })
            .catch(function(error) {
                console.error('Failed to load ABCJS:', error);
                retryCount++;
                
                if (retryCount < maxRetries) {
                    console.log('Retrying... (' + retryCount + '/' + maxRetries + ')');
                    
                    var delay = Math.min(500 * Math.pow(1.5, retryCount), 5000);
                    setTimeout(initAbcNotation, delay);
                } else {
                    document.getElementById(elementId).innerHTML =
                        '<p class="abc-error">Failed to load music notation library. Please check your internet connection and try refreshing the page.</p>';
                }
            });
    }

    function renderNotation() {
        try {
            
            document.getElementById(elementId).innerHTML = 'Loading music notation...';
            
            var visualObj = ABCJS.renderAbc(elementId, abcNotation, {
                responsive: 'resize',
                add_classes: true,
                staffwidth: 700,
                paddingtop: 10,
                paddingbottom: 10,
                paddingleft: 10,
                paddingright: 10
            });

            if (visualObj && visualObj.length > 0) {
                if (ABCJS.synth.supportsAudio()) {
                    setupAudioControls(audioId, visualObj[0], elementId);
                } else {
                    document.getElementById(audioId).innerHTML =
                        '<p class="abc-error">Audio playback not supported in this browser.</p>';
                }
            } else {
                document.getElementById(elementId).innerHTML =
                    '<p class="abc-warning">No music notation to display. Check your ABC syntax.</p>';
            }
        } catch (error) {
            console.error('Error rendering ABC notation:', error);
            document.getElementById(elementId).innerHTML =
                '<p class="abc-error">Error rendering music notation: ' + error.message + '</p>';
        }
    }

    function setupAudioControls(audioId, visualObj, elementId) {
        try {
            var cursorControl = new MyCursorControl('#' + elementId);
            var synthControl = new ABCJS.synth.SynthController();
            
            synthControl.load('#' + audioId, cursorControl, {
                displayLoop: false,
                displayRestart: true,
                displayPlay: true,
                displayProgress: true,
                displayWarp: false,
                displayTempo: true,
                displayInstrument: false
            });

            synthControl.setTune(visualObj, false);

        } catch (error) {
            console.error('Error setting up audio controls:', error);
            document.getElementById(audioId).innerHTML =
                '<p class="abc-error">Audio setup failed: ' + error.message + '</p>';
        }
    }

    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAbcNotation);
    } else {
        initAbcNotation();
    }
})();
</script>
