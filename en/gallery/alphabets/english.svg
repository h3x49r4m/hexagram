<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7971e"/>
      <stop offset="100%" style="stop-color:#ffd200"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="url(#bgGrad)"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="860" height="660" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>
  <rect x="28" y="28" width="844" height="644" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Title -->
  <text x="450" y="72" text-anchor="middle" fill="#ffd700" font-size="36" font-weight="bold" filter="url(#glow)">English Alphabet</text>
  <text x="450" y="100" text-anchor="middle" fill="#b8b8d0" font-size="16" letter-spacing="4">LATIN SCRIPT — 26 LETTERS</text>
  
  <line x1="100" y1="118" x2="800" y2="118" stroke="#ffd700" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Uppercase Letters Grid -->
  <g filter="url(#softShadow)">
    <!-- Row 1: A–H -->
    <rect x="50" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="92" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">A</text>
    
    <rect x="150" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="192" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">B</text>
    
    <rect x="250" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="292" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">C</text>
    
    <rect x="350" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="392" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">D</text>
    
    <rect x="450" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="492" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">E</text>
    
    <rect x="550" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="592" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">F</text>
    
    <rect x="650" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="692" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">G</text>
    
    <rect x="750" y="145" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="792" y="200" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">H</text>
    
    <!-- Row 2: I–P -->
    <rect x="50" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="92" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">I</text>
    
    <rect x="150" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="192" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">J</text>
    
    <rect x="250" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="292" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">K</text>
    
    <rect x="350" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="392" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">L</text>
    
    <rect x="450" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="492" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">M</text>
    
    <rect x="550" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="592" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">N</text>
    
    <rect x="650" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="692" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">O</text>
    
    <rect x="750" y="240" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="792" y="295" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">P</text>
    
    <!-- Row 3: Q–X -->
    <rect x="50" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="92" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">Q</text>
    
    <rect x="150" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="192" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">R</text>
    
    <rect x="250" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="292" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">S</text>
    
    <rect x="350" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="392" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">T</text>
    
    <rect x="450" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="492" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">U</text>
    
    <rect x="550" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="592" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">V</text>
    
    <rect x="650" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="692" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">W</text>
    
    <rect x="750" y="335" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="792" y="390" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">X</text>
    
    <!-- Row 4: Y–Z -->
    <rect x="50" y="430" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="92" y="485" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">Y</text>
    
    <rect x="150" y="430" width="85" height="80" rx="6" fill="#2a2a4a" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>
    <text x="192" y="485" text-anchor="middle" fill="#ffd700" font-size="44" font-weight="bold">Z</text>
  </g>
  
  <!-- Lowercase row -->
  <text x="450" y="570" text-anchor="middle" fill="#b8b8d0" font-size="18" letter-spacing="6">
    a b c d e f g h i j k l m n o p q r s t u v w x y z
  </text>
  
  <!-- Pangram -->
  <text x="450" y="608" text-anchor="middle" fill="#8a8aaa" font-size="17" font-style="italic">
    "The quick brown fox jumps over the lazy dog"
  </text>
  <text x="450" y="635" text-anchor="middle" fill="#5a5a7a" font-size="12">
    — A pangram containing all 26 letters —
  </text>
  
  <!-- Vowel highlight -->
  <text x="450" y="670" text-anchor="middle" fill="#ffd700" font-size="13" opacity="0.6">
    Vowels: A · E · I · O · U
  </text>
</svg>
