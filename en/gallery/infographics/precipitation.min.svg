<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" font-family="'Segoe UI', Arial, sans-serif"><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#0a1628;stop-opacity:1"/><stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1"/></linearGradient><linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#e8f0fe;stop-opacity:.9"/><stop offset="100%" style="stop-color:#b0c4de;stop-opacity:.9"/></linearGradient><radialGradient id="rainGrad" cx="40%" cy="30%"><stop offset="0" style="stop-color:#7ec8e3"/><stop offset="100%" style="stop-color:#1a5276"/></radialGradient><radialGradient id="snowGrad" cx="40%" cy="30%"><stop offset="0" style="stop-color:#ffffff"/><stop offset="100%" style="stop-color:#a0c4e8"/></radialGradient><linearGradient id="headerGrad" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" style="stop-color:#2980b9"/><stop offset="100%" style="stop-color:#6dd5fa"/></linearGradient><linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#1e3a5f;stop-opacity:.85"/><stop offset="100%" style="stop-color:#0d2137;stop-opacity:.85"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".3"/></filter></defs><rect width="800" height="1200" fill="url(#bgGrad)"/><circle cx="700" cy="100" r="150" fill="#2a5298" opacity=".1"/><circle cx="100" cy="1100" r="200" fill="#2a5298" opacity=".08"/><circle cx="650" cy="900" r="80" fill="#6dd5fa" opacity=".05"/><rect x="50" y="30" width="700" height="110" rx="15" fill="url(#headerGrad)" filter="url(#shadow)" opacity=".95"/><text x="400" y="75" text-anchor="middle" fill="#fff" font-size="32" font-weight="bold" filter="url(#glow)">🌧️ PRECIPITATION</text><text x="400" y="110" text-anchor="middle" fill="#e8f0fe" font-size="16">Any form of water — liquid or solid — falling from clouds to Earth's surface</text><rect x="50" y="165" width="700" height="330" rx="12" fill="url(#cardGrad)" stroke="#4a8bb7" stroke-width="1.5" filter="url(#shadow)"/><text x="400" y="200" text-anchor="middle" fill="#6dd5fa" font-size="20" font-weight="bold">❄️ Types of Precipitation</text><line x1="150" y1="212" x2="650" y2="212" stroke="#4a8bb7" stroke-width="1" opacity=".5"/><circle cx="140" cy="265" r="40" fill="url(#rainGrad)" opacity=".8"/><text x="140" y="270" text-anchor="middle" fill="#fff" font-size="30">💧</text><text x="200" y="258" fill="#fff" font-size="18" font-weight="bold">Rain</text><text x="200" y="280" fill="#b0c4de" font-size="13">Liquid water droplets</text><text x="200" y="298" fill="#7ec8e3" font-size="12">> 0.5 mm diameter</text><circle cx="140" cy="340" r="40" fill="url(#snowGrad)" opacity=".8"/><text x="140" y="345" text-anchor="middle" fill="#1a3a5c" font-size="30">❄️</text><text x="200" y="333" fill="#fff" font-size="18" font-weight="bold">Snow</text><text x="200" y="355" fill="#b0c4de" font-size="13">Ice crystals / flakes</text><text x="200" y="373" fill="#7ec8e3" font-size="12">Forms in cold clouds</text><circle cx="460" cy="265" r="40" fill="#89a" opacity=".8"/><text x="460" y="270" text-anchor="middle" fill="#fff" font-size="30">🌨️</text><text x="520" y="258" fill="#fff" font-size="18" font-weight="bold">Sleet</text><text x="520" y="280" fill="#b0c4de" font-size="13">Rain that freezes</text><text x="520" y="298" fill="#7ec8e3" font-size="12">Ice pellets</text><circle cx="460" cy="340" r="40" fill="#abc" opacity=".8"/><text x="460" y="345" text-anchor="middle" fill="#fff" font-size="30">⛈️</text><text x="520" y="333" fill="#fff" font-size="18" font-weight="bold">Hail</text><text x="520" y="355" fill="#b0c4de" font-size="13">Layered ice balls</text><text x="520" y="373" fill="#7ec8e3" font-size="12">Forms in thunderstorms</text><circle cx="320" cy="430" r="30" fill="#5b9bd5" opacity=".7"/><text x="320" y="435" text-anchor="middle" fill="#fff" font-size="22">🌦️</text><text x="370" y="425" fill="#fff" font-size="16" font-weight="bold">Drizzle</text><text x="370" y="445" fill="#b0c4de" font-size="12">&lt; 0.5 mm droplets</text><circle cx="500" cy="430" r="30" fill="#8ab8d9" opacity=".7"/><text x="500" y="435" text-anchor="middle" fill="#fff" font-size="22">🧊</text><text x="550" y="425" fill="#fff" font-size="16" font-weight="bold">Freezing Rain</text><text x="550" y="445" fill="#b0c4de" font-size="12">Forms ice coating</text><rect x="50" y="520" width="700" height="260" rx="12" fill="url(#cardGrad)" stroke="#4a8bb7" stroke-width="1.5" filter="url(#shadow)"/><text x="400" y="555" text-anchor="middle" fill="#6dd5fa" font-size="20" font-weight="bold">🔄 How Precipitation Forms</text><line x1="150" y1="567" x2="650" y2="567" stroke="#4a8bb7" stroke-width="1" opacity=".5"/><rect x="80" y="585" width="190" height="75" rx="8" fill="#1a4a6a" opacity=".8"/><text x="175" y="610" text-anchor="middle" fill="#7ec8e3" font-size="14" font-weight="bold">1. Evaporation</text><text x="175" y="630" text-anchor="middle" fill="#b0c4de" font-size="11">Sun heats water</text><text x="175" y="648" text-anchor="middle" fill="#b0c4de" font-size="11">Water vapor rises</text><text x="278" y="630" fill="#6dd5fa" font-size="20">→</text><rect x="295" y="585" width="190" height="75" rx="8" fill="#1a4a6a" opacity=".8"/><text x="390" y="610" text-anchor="middle" fill="#7ec8e3" font-size="14" font-weight="bold">2. Condensation</text><text x="390" y="630" text-anchor="middle" fill="#b0c4de" font-size="11">Vapor cools &amp; condenses</text><text x="390" y="648" text-anchor="middle" fill="#b0c4de" font-size="11">Clouds form</text><text x="493" y="630" fill="#6dd5fa" font-size="20">→</text><rect x="510" y="585" width="210" height="75" rx="8" fill="#1a4a6a" opacity=".8"/><text x="615" y="610" text-anchor="middle" fill="#7ec8e3" font-size="14" font-weight="bold">3. Precipitation</text><text x="615" y="630" text-anchor="middle" fill="#b0c4de" font-size="11">Droplets become heavy</text><text x="615" y="648" text-anchor="middle" fill="#b0c4de" font-size="11">Fall as rain/snow</text><path d="M175 680q0 30 125 30 90 0 90-30" stroke="#6dd5fa" stroke-width="1.5" fill="none" opacity=".4" stroke-dasharray="5,5"/><path d="M390 680q0 30 140 30 85 0 85-30" stroke="#6dd5fa" stroke-width="1.5" fill="none" opacity=".4" stroke-dasharray="5,5"/><text x="400" y="735" text-anchor="middle" fill="#4a8bb7" font-size="11">The Water Cycle Continues...</text><rect x="50" y="805" width="340" height="200" rx="12" fill="url(#cardGrad)" stroke="#4a8bb7" stroke-width="1.5" filter="url(#shadow)"/><text x="220" y="840" text-anchor="middle" fill="#6dd5fa" font-size="18" font-weight="bold">📏 Measuring Precipitation</text><line x1="80" y1="852" x2="360" y2="852" stroke="#4a8bb7" stroke-width="1" opacity=".5"/><text x="80" y="880" fill="#fff" font-size="14" font-weight="bold">Rain Gauge</text><text x="80" y="900" fill="#b0c4de" font-size="12">• Collects rain in a funnel</text><text x="80" y="918" fill="#b0c4de" font-size="12">• Measured in mm or inches</text><text x="80" y="936" fill="#b0c4de" font-size="12">• 1 mm rain = 1 L/m²</text><text x="80" y="970" fill="#fff" font-size="14" font-weight="bold">Radar &amp; Satellites</text><text x="80" y="990" fill="#b0c4de" font-size="12">• Doppler radar detects drops</text><text x="80" y="1008" fill="#b0c4de" font-size="12">• Satellites track cloud systems</text><rect x="410" y="805" width="340" height="200" rx="12" fill="url(#cardGrad)" stroke="#4a8bb7" stroke-width="1.5" filter="url(#shadow)"/><text x="580" y="840" text-anchor="middle" fill="#6dd5fa" font-size="18" font-weight="bold">🌍 Global Precipitation Facts</text><line x1="440" y1="852" x2="720" y2="852" stroke="#4a8bb7" stroke-width="1" opacity=".5"/><text x="440" y="880" fill="#fff" font-size="14" font-weight="bold">☔ Wettest Place</text><text x="440" y="900" fill="#b0c4de" font-size="12">Mawsynram, India — ~11,872 mm/year</text><text x="440" y="930" fill="#fff" font-size="14" font-weight="bold">🏜️ Driest Place</text><text x="440" y="950" fill="#b0c4de" font-size="12">Atacama Desert, Chile — ~1 mm/year</text><text x="440" y="980" fill="#fff" font-size="14" font-weight="bold">⚡ Fastest Rain</text><text x="440" y="1e3" fill="#b0c4de" font-size="12">Can fall at 20 mph (32 km/h)</text><rect x="200" y="1035" width="400" height="40" rx="20" fill="#1a3a5c" opacity=".6" stroke="#4a8bb7" stroke-width="1"/><text x="400" y="1060" text-anchor="middle" fill="#7ec8e3" font-size="13">💡 Precipitation is essential for all life on Earth</text><text x="50" y="1120" fill="#4a8bb7" font-size="12" opacity=".5">Weather Infographic Series</text><text x="750" y="1120" text-anchor="end" fill="#4a8bb7" font-size="12" opacity=".5">☁️</text><g opacity=".1"><ellipse cx="120" cy="50" rx="30" ry="12" fill="#fff"/><ellipse cx="100" cy="48" rx="20" ry="10" fill="#fff"/><ellipse cx="140" cy="48" rx="18" ry="9" fill="#fff"/></g><g opacity=".1"><ellipse cx="700" cy="1150" rx="40" ry="15" fill="#fff"/><ellipse cx="675" cy="1148" rx="25" ry="12" fill="#fff"/><ellipse cx="725" cy="1148" rx="22" ry="11" fill="#fff"/></g></svg>