" rx="4" fill="#2a5a3a" opacity=".85"/><text x="80" y="57" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Altostratus</text><text x="80" y="76" text-anchor="middle" fill="#a0c8b0" font-size="10">Gray, uniform</text></g><g transform="translate(260, 0)" filter="url(#softShadow)"><ellipse cx="25" cy="18" rx="28" ry="12" fill="#e4e8ee" opacity=".85"/><ellipse cx="65" cy="14" rx="28" ry="12" fill="#eef2f6" opacity=".85"/><ellipse cx="105" cy="18" rx="28" ry="12" fill="#d8dce4" opacity=".85"/><ellipse cx="45" cy="30" rx="28" ry="12" fill="#d0d4dc" opacity=".75"/><ellipse cx="85" cy="30" rx="28" ry="12" fill="#d8dce4" opacity=".75"/><rect x="15" y="46" width="130" height="18" rx="4" fill="#2a5a3a" opacity=".85"/><text x="80" y="59" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Altocumulus</text><text x="80" y="78" text-anchor="middle" fill="#a0c8b0" font-size="10">Patchy, rippled</text></g><g transform="translate(530, 0)" filter="url(#softShadow)"><ellipse cx="70" cy="20" rx="85" ry="22" fill="#9098a0" opacity=".85"/><ellipse cx="80" cy="18" rx="75" ry="20" fill="#808890" opacity=".75"/><ellipse cx="60" cy="22" rx="80" ry="18" fill="#707880" opacity=".65"/><ellipse cx="70" cy="26" rx="70" ry="14" fill="#606870" opacity=".55"/><line x1="35" y1="40" x2="30" y2="50" stroke="#4a7a9a" stroke-width="1.5" opacity=".5"/><line x1="55" y1="42" x2="50" y2="52" stroke="#4a7a9a" stroke-width="1.5" opacity=".5"/><line x1="75" y1="40" x2="70" y2="50" stroke="#4a7a9a" stroke-width="1.5" opacity=".5"/><line x1="95" y1="42" x2="90" y2="52" stroke="#4a7a9a" stroke-width="1.5" opacity=".5"/><rect x="10" y="50" width="130" height="18" rx="4" fill="#2a3a3a" opacity=".9"/><text x="75" y="63" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Nimbostratus</text><text x="75" y="82" text-anchor="middle" fill="#90b0c0" font-size="10">🌧️ Rain-bearing</text></g></g><g transform="translate(50, 490)"><g filter="url(#softShadow)"><ellipse cx="80" cy="18" rx="95" ry="16" fill="#d8dce4" opacity=".85"/><ellipse cx="90" cy="16" rx="85" ry="14" fill="#e4e8ee" opacity=".75"/><ellipse cx="70" cy="20" rx="90" ry="12" fill="#c8d0d8" opacity=".65"/><rect x="20" y="40" width="120" height="18" rx="4" fill="#8a6a2a" opacity=".85"/><text x="80" y="53" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Stratus</text><text x="80" y="72" text-anchor="middle" fill="#e0c890" font-size="10">Low, fog-like</text></g><g transform="translate(260, 0)" filter="url(#softShadow)"><ellipse cx="30" cy="16" rx="32" ry="14" fill="#e4e8ee" opacity=".85"/><ellipse cx="78" cy="12" rx="32" ry="14" fill="#eef2f6" opacity=".85"/><ellipse cx="54" cy="28" rx="32" ry="14" fill="#d8dce4" opacity=".75"/><ellipse cx="102" cy="24" rx="32" ry="14" fill="#d0d4dc" opacity=".75"/><rect x="15" y="46" width="130" height="18" rx="4" fill="#8a6a2a" opacity=".85"/><text x="80" y="59" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Stratocumulus</text><text x="80" y="78" text-anchor="middle" fill="#e0c890" font-size="10">Rolls or patches</text></g><g transform="translate(520, 0)" filter="url(#softShadow)"><ellipse cx="50" cy="20" rx="48" ry="24" fill="#fff" opacity=".95"/><ellipse cx="85" cy="14" rx="42" ry="22" fill="#fff" opacity=".9"/><ellipse cx="65" cy="8" rx="38" ry="20" fill="#fff" opacity=".95"/><ellipse cx="58" cy="2" rx="25" ry="15" fill="#fff" opacity="1"/><ellipse cx="75" cy="4" rx="18" ry="12" fill="#fff" opacity=".9"/><rect x="15" y="48" width="120" height="18" rx="4" fill="#8a6a2a" opacity=".85"/><text x="75" y="61" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Cumulus</text><text x="75" y="80" text-anchor="middle" fill="#e0c890" font-size="10">☀️ Fair weather</text></g></g><g transform="translate(140, 590)" filter="url(#softShadow)"><ellipse cx="120" cy="40" rx="100" ry="28" fill="#a0a8b0" opacity=".85"/><ellipse cx="130" cy="36" rx="90" ry="26" fill="#b0b8c0" opacity=".75"/><ellipse cx="115" cy="22" rx="75" ry="24" fill="#c0c8d0" opacity=".7"/><ellipse cx="125" cy="16" rx="60" ry="22" fill="#d0d8e0" opacity=".65"/><ellipse cx="120" cy="4" rx="45" ry="18" fill="#e0e8f0" opacity=".6"/><ellipse cx="125" cy="-6" rx="30" ry="14" fill="#eef2f6" opacity=".55"/><ellipse cx="130" cy="-14" rx="50" ry="10" fill="#e8ecf0" opacity=".5"/><ellipse cx="140" cy="-18" rx="40" ry="8" fill="#f0f4f8" opacity=".4"/><ellipse cx="110" cy="52" rx="110" ry="22" fill="#707880" opacity=".7"/><ellipse cx="120" cy="58" rx="100" ry="18" fill="#606870" opacity=".6"/><path d="M160 10 145 35h13L140 65l25-35H150z" fill="#ffd54f" opacity=".8"/><path d="M160 10 145 35h13L140 65l25-35H150z" fill="#fff9c4" opacity=".3"/><line x1="60" y1="68" x2="55" y2="82" stroke="#4a7a9a" stroke-width="2" opacity=".6"/><line x1="80" y1="70" x2="75" y2="84" stroke="#4a7a9a" stroke-width="2" opacity=".6"/><line x1="100" y1="68" x2="95" y2="82" stroke="#4a7a9a" stroke-width="2" opacity=".6"/><line x1="120" y1="70" x2="115" y2="84" stroke="#4a7a9a" stroke-width="2" opacity=".6"/><line x1="140" y1="68" x2="135" y2="82" stroke="#4a7a9a" stroke-width="2" opacity=".6"/><line x1="160" y1="70" x2="155" y2="84" stroke="#4a7a9a" stroke-width="2" opacity=".6"/><rect x="30" y="88" width="180" height="22" rx="4" fill="#2a2a3a" opacity=".9"/><text x="120" y="103" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">Cumulonimbus</text><text x="120" y="122" text-anchor="middle" fill="#90b0c0" font-size="11">⛈️ Thunderstorm / Heavy rain / Hail</text></g><g transform="translate(50, 755)" filter="url(#softShadow)"><rect x="0" y="0" width="800" height="260" rx="14" fill="#fff"/><rect x="0" y="0" width="800" height="44" rx="14" fill="#1a3a5c"/><rect x="0" y="30" width="800" height="14" fill="#1a3a5c"/><text x="400" y="29" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" letter-spacing="2">📖 CLOUD CLASSIFICATION GUIDE</text><text x="40" y="72" fill="#1a3a5c" font-size="15" font-weight="700">By Shape:</text><rect x="40" y="84" width="14" height="14" rx="3" fill="#d8dce4" stroke="#b0b8c0" stroke-width="1"/><text x="62" y="96" fill="#333" font-size="13">Stratus — Layered, sheet-like clouds</text><rect x="40" y="108" width="14" height="14" rx="3" fill="#fff" stroke="#d0d8e0" stroke-width="1"/><text x="62" y="120" fill="#333" font-size="13">Cumulus — Puffy, heaped clouds</text><rect x="40" y="132" width="14" height="14" rx="3" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1"/><text x="62" y="144" fill="#333" font-size="13">Cirrus — Wispy, feathery ice clouds</text><rect x="40" y="156" width="14" height="14" rx="3" fill="#808890" stroke="#606870" stroke-width="1"/><text x="62" y="168" fill="#333" font-size="13">Nimbus — Rain-bearing clouds</text><text x="420" y="72" fill="#1a3a5c" font-size="15" font-weight="700">By Altitude:</text><rect x="420" y="84" width="14" height="14" rx="3" fill="#4fc3f7"/><text x="442" y="96" fill="#333" font-size="13">Cirro- (High: 5–13 km)</text><rect x="420" y="108" width="14" height="14" rx="3" fill="#66bb6a"/><text x="442" y="120" fill="#333" font-size="13">Alto- (Mid: 2–7 km)</text><rect x="420" y="132" width="14" height="14" rx="3" fill="#ffa726"/><text x="442" y="144" fill="#333" font-size="13">Strato- (Low: 0–2 km)</text><text x="40" y="205" fill="#1a3a5c" font-size="14" font-weight="700">Common Combinations:</text><text x="40" y="228" fill="#555" font-size="12">• Cirrocumulus = High + Heaped</text><text x="40" y="248" fill="#555" font-size="12">• Stratocumulus = Low + Heaped</text><text x="420" y="205" fill="#1a3a5c" font-size="14" font-weight="700">💡 Tip:</text><text x="420" y="228" fill="#555" font-size="12">Clouds with "Nimbo-" or "-nimbus"</text><text x="420" y="248" fill="#555" font-size="12">bring precipitation!</text></g><text x="450" y="1040" text-anchor="middle" fill="#8898a0" font-size="11" letter-spacing="1">Clouds are classified by their altitude, shape, and whether they produce precipitation</text></svg>