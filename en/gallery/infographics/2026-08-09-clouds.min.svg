<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" font-family="'Segoe UI', Roboto, Arial, sans-serif"><defs><linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d3a"/><stop offset="25%" stop-color="#1a4a7a"/><stop offset="55%" stop-color="#4a8db7"/><stop offset="85%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#b8dce8"/></linearGradient><linearGradient id="cloudWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="100%" stop-color="#d8dce4"/></linearGradient><linearGradient id="cloudGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8ecf0"/><stop offset="100%" stop-color="#b0b8c0"/></linearGradient><linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b0b8c0"/><stop offset="100%" stop-color="#606870"/></linearGradient><linearGradient id="cloudStorm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#808890"/><stop offset="100%" stop-color="#3a4048"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#00000033"/></filter><filter id="hardShadow" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000044"/></filter><radialGradient id="star"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="900" height="1050" fill="#e8eef4" rx="16"/><rect y="0" width="900" height="520" fill="url(#skyGrad)" rx="16"/><rect y="500" width="900" height="20" fill="url(#skyGrad)"/><circle cx="100" cy="40" r="1.5" fill="#fff" opacity=".6"/><circle cx="250" cy="25" r="1" fill="#fff" opacity=".4"/><circle cx="400" cy="35" r="1.5" fill="#fff" opacity=".5"/><circle cx