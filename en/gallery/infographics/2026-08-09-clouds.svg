<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <!-- Sky gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="25%" stop-color="#1a4a7a"/>
      <stop offset="55%" stop-color="#4a8db7"/>
      <stop offset="85%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#b8dce8"/>
    </linearGradient>

    <!-- Cloud gradients -->
    <linearGradient id="cloudWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8dce4"/>
    </linearGradient>
    <linearGradient id="cloudGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ecf0"/>
      <stop offset="100%" stop-color="#b0b8c0"/>
    </linearGradient>
    <linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0b8c0"/>
      <stop offset="100%" stop-color="#606870"/>
    </linearGradient>
    <linearGradient id="cloudStorm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#808890"/>
      <stop offset="100%" stop-color="#3a4048"/>
    </linearGradient>

    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#00000033"/>
    </filter>
    <filter id="hardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#00000044"/>
    </filter>

    <!-- Stars -->
    <radialGradient id="star">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1050" fill="#e8eef4" rx="16"/>

  <!-- Sky area -->
  <rect y="0" width="900" height="520" fill="url(#skyGrad)" rx="16"/>
  <rect y="500" width="900" height="20" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="100" cy="40" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="250" cy="25" r="1" fill="white" opacity="0.4"/>
  <circle cx="400" cy="35" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="580" cy="20" r="1" fill="white" opacity="0.3"/>
  <circle cx="700" cy="45" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="820" cy="30" r="1" fill="white" opacity="0.4"/>
  <circle cx="150" cy="55" r="1" fill="white" opacity="0.3"/>
  <circle cx="500" cy="50" r="1" fill="white" opacity="0.4"/>
  <circle cx="780" cy="55" r="1" fill="white" opacity="0.3"/>

  <!-- Title -->
  <text x="450" y="65" text-anchor="middle" fill="white" font-size="38" font-weight="800" letter-spacing="3" filter="url(#glow)">☁️ CLOUD TYPES</text>
  <text x="450" y="105" text-anchor="middle" fill="#b0d8e8" font-size="18" font-weight="300" letter-spacing="5">A VISUAL GUIDE TO CLOUD CLASSIFICATION</text>

  <!-- Altitude scale -->
  <g transform="translate(50, 145)">
    <!-- Scale bar -->
    <rect x="0" y="0" width="800" height="24" rx="12" fill="white" opacity="0.15"/>
    <rect x="2" y="2" width="796" height="20" rx="10" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>

    <!-- Altitude markers -->
    <text x="0" y="46" fill="white" font-size="12" font-weight="bold" opacity="0.9">High</text>
    <text x="0" y="110" fill="white" font-size="12" font-weight="bold" opacity="0.9">Mid</text>
    <text x="0" y="178" fill="white" font-size="12" font-weight="bold" opacity="0.9">Low</text>

    <!-- High zone -->
    <rect x="10" y="5" width="250" height="14" rx="3" fill="#4fc3f7" opacity="0.3"/>
    <!-- Mid zone -->
    <rect x="270" y="5" width="250" height="14" rx="3" fill="#66bb6a" opacity="0.3"/>
    <!-- Low zone -->
    <rect x="530" y="5" width="250" height="14" rx="3" fill="#ffa726" opacity="0.3"/>

    <!-- Altitude lines -->
    <line x1="10" y1="24" x2="10" y2="35" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="270" y1="24" x2="270" y2="35" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="530" y1="24" x2="530" y2="35" stroke="white" stroke-width="1" opacity="0.5"/>

    <text x="10" y="48" text-anchor="middle" fill="#b0d8e8" font-size="10" opacity="0.8">5–13 km</text>
    <text x="270" y="112" text-anchor="middle" fill="#b0d8e8" font-size="10" opacity="0.8">2–7 km</text>
    <text x="530" y="180" text-anchor="middle" fill="#b0d8e8" font-size="10" opacity="0.8">0–2 km</text>
  </g>

  <!-- ==================== HIGH LEVEL ==================== -->

  <g transform="translate(50, 200)">
    <!-- Cirrus -->
    <g filter="url(#softShadow)">
      <path d="M20,25 Q40,12 60,22 Q75,8 95,20 Q110,10 130,22 L125,28 Q110,18 95,26 Q75,14 60,28 Q40,18 20,30 Z" fill="white" opacity="0.75"/>
      <path d="M50,20 Q65,8 80,18 Q95,6 110,16 L108,22 Q95,12 80,22 Q65,12 50,24 Z" fill="white" opacity="0.6"/>
      <rect x="10" y="40" width="100" height="18" rx="4" fill="#1a4a7a" opacity="0.8"/>
      <text x="60" y="53" text-anchor="middle" fill="white" font-size="13" font-weight="700">Cirrus</text>
      <text x="60" y="72" text-anchor="middle" fill="#b0d8e8" font-size="10">Wispy, ice crystals</text>
    </g>

    <!-- Cirrostratus -->
    <g transform="translate(230, 0)" filter="url(#softShadow)">
      <ellipse cx="60" cy="22" rx="80" ry="14" fill="white" opacity="0.35"/>
      <ellipse cx="65" cy="20" rx="70" ry="12" fill="white" opacity="0.25"/>
      <ellipse cx="55" cy="24" rx="75" ry="10" fill="white" opacity="0.20"/>
      <rect x="10" y="40" width="130" height="18" rx="4" fill="#1a4a7a" opacity="0.8"/>
      <text x="75" y="53" text-anchor="middle" fill="white" font-size="12" font-weight="700">Cirrostratus</text>
      <text x="75" y="72" text-anchor="middle" fill="#b0d8e8" font-size="10">Veil-like, halos</text>
    </g>

    <!-- Cirrocumulus -->
    <g transform="translate(510, 0)" filter="url(#softShadow)">
      <ellipse cx="25" cy="18" rx="22" ry="9" fill="white" opacity="0.7"/>
      <ellipse cx="60" cy="15" rx="22" ry="9" fill="white" opacity="0.7"/>
      <ellipse cx="95" cy="18" rx="22" ry="9" fill="white" opacity="0.7"/>
      <ellipse cx="42" cy="28" rx="22" ry="9" fill="white" opacity="0.6"/>
      <ellipse cx="77" cy="28" rx="22" ry="9" fill="white" opacity="0.6"/>
      <rect x="10" y="42" width="120" height="18" rx="4" fill="#1a4a7a" opacity="0.8"/>
      <text x="70" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="700">Cirrocumulus</text>
      <text x="70" y="74" text-anchor="middle" fill="#b0d8e8" font-size="10">Mackerel sky</text>
    </g>
  </g>

  <!-- ==================== MID LEVEL ==================== -->

  <g transform="translate(50, 345)">
    <!-- Altostratus -->
    <g filter="url(#softShadow)">
      <ellipse cx="80" cy="20" rx="90" ry="18" fill="#d8dce4" opacity="0.8"/>
      <ellipse cx="90" cy="18" rx="80" ry="16" fill="#e4e8ee" opacity="0.7"/>
      <ellipse cx="70" cy="22" rx="85" ry="14" fill="#c8d0d8" opacity="0.6"/>
      <rect x="20" y="44" width="120" height="18" rx="4" fill="#2a5a3a" opacity="0.85"/>
      <text x="80" y="57" text-anchor="middle" fill="white" font-size="12" font-weight="700">Altostratus</text>
      <text x="80" y="76" text-anchor="middle" fill="#a0c8b0" font-size="10">Gray, uniform</text>
    </g>

    <!-- Altocumulus -->
    <g transform="translate(260, 0)" filter="url(#softShadow)">
      <ellipse cx="25" cy="18" rx="28" ry="12" fill="#e4e8ee" opacity="0.85"/>
      <ellipse cx="65" cy="14" rx="28" ry="12" fill="#eef2f6" opacity="0.85"/>
      <ellipse cx="105" cy="18" rx="28" ry="12" fill="#d8dce4" opacity="0.85"/>
      <ellipse cx="45" cy="30" rx="28" ry="12" fill="#d0d4dc" opacity="0.75"/>
      <ellipse cx="85" cy="30" rx="28" ry="12" fill="#d8dce4" opacity="0.75"/>
      <rect x="15" y="46" width="130" height="18" rx="4" fill="#2a5a3a" opacity="0.85"/>
      <text x="80" y="59" text-anchor="middle" fill="white" font-size="12" font-weight="700">Altocumulus</text>
      <text x="80" y="78" text-anchor="middle" fill="#a0c8b0" font-size="10">Patchy, rippled</text>
    </g>

    <!-- Nimbostratus -->
    <g transform="translate(530, 0)" filter="url(#softShadow)">
      <ellipse cx="70" cy="20" rx="85" ry="22" fill="#9098a0" opacity="0.85"/>
      <ellipse cx="80" cy="18" rx="75" ry="20" fill="#808890" opacity="0.75"/>
      <ellipse cx="60" cy="22" rx="80" ry="18" fill="#707880" opacity="0.65"/>
      <ellipse cx="70" cy="26" rx="70" ry="14" fill="#606870" opacity="0.55"/>
      <!-- Rain drops -->
      <line x1="35" y1="40" x2="30" y2="50" stroke="#4a7a9a" stroke-width="1.5" opacity="0.5"/>
      <line x1="55" y1="42" x2="50" y2="52" stroke="#4a7a9a" stroke-width="1.5" opacity="0.5"/>
      <line x1="75" y1="40" x2="70" y2="50" stroke="#4a7a9a" stroke-width="1.5" opacity="0.5"/>
      <line x1="95" y1="42" x2="90" y2="52" stroke="#4a7a9a" stroke-width="1.5" opacity="0.5"/>
      <rect x="10" y="50" width="130" height="18" rx="4" fill="#2a3a3a" opacity="0.9"/>
      <text x="75" y="63" text-anchor="middle" fill="white" font-size="12" font-weight="700">Nimbostratus</text>
      <text x="75" y="82" text-anchor="middle" fill="#90b0c0" font-size="10">🌧️ Rain-bearing</text>
    </g>
  </g>

  <!-- ==================== LOW LEVEL ==================== -->

  <g transform="translate(50, 490)">
    <!-- Stratus -->
    <g filter="url(#softShadow)">
      <ellipse cx="80" cy="18" rx="95" ry="16" fill="#d8dce4" opacity="0.85"/>
      <ellipse cx="90" cy="16" rx="85" ry="14" fill="#e4e8ee" opacity="0.75"/>
      <ellipse cx="70" cy="20" rx="90" ry="12" fill="#c8d0d8" opacity="0.65"/>
      <rect x="20" y="40" width="120" height="18" rx="4" fill="#8a6a2a" opacity="0.85"/>
      <text x="80" y="53" text-anchor="middle" fill="white" font-size="12" font-weight="700">Stratus</text>
      <text x="80" y="72" text-anchor="middle" fill="#e0c890" font-size="10">Low, fog-like</text>
    </g>

    <!-- Stratocumulus -->
    <g transform="translate(260, 0)" filter="url(#softShadow)">
      <ellipse cx="30" cy="16" rx="32" ry="14" fill="#e4e8ee" opacity="0.85"/>
      <ellipse cx="78" cy="12" rx="32" ry="14" fill="#eef2f6" opacity="0.85"/>
      <ellipse cx="54" cy="28" rx="32" ry="14" fill="#d8dce4" opacity="0.75"/>
      <ellipse cx="102" cy="24" rx="32" ry="14" fill="#d0d4dc" opacity="0.75"/>
      <rect x="15" y="46" width="130" height="18" rx="4" fill="#8a6a2a" opacity="0.85"/>
      <text x="80" y="59" text-anchor="middle" fill="white" font-size="12" font-weight="700">Stratocumulus</text>
      <text x="80" y="78" text-anchor="middle" fill="#e0c890" font-size="10">Rolls or patches</text>
    </g>

    <!-- Cumulus -->
    <g transform="translate(520, 0)" filter="url(#softShadow)">
      <ellipse cx="50" cy="20" rx="48" ry="24" fill="white" opacity="0.95"/>
      <ellipse cx="85" cy="14" rx="42" ry="22" fill="white" opacity="0.9"/>
      <ellipse cx="65" cy="8" rx="38" ry="20" fill="white" opacity="0.95"/>
      <ellipse cx="58" cy="2" rx="25" ry="15" fill="white" opacity="1"/>
      <ellipse cx="75" cy="4" rx="18" ry="12" fill="white" opacity="0.9"/>
      <rect x="15" y="48" width="120" height="18" rx="4" fill="#8a6a2a" opacity="0.85"/>
      <text x="75" y="61" text-anchor="middle" fill="white" font-size="12" font-weight="700">Cumulus</text>
      <text x="75" y="80" text-anchor="middle" fill="#e0c890" font-size="10">☀️ Fair weather</text>
    </g>
  </g>

  <!-- ==================== VERTICAL DEVELOPMENT ==================== -->

  <g transform="translate(140, 590)" filter="url(#softShadow)">
    <!-- Cloud base -->
    <ellipse cx="120" cy="40" rx="100" ry="28" fill="#a0a8b0" opacity="0.85"/>
    <ellipse cx="130" cy="36" rx="90" ry="26" fill="#b0b8c0" opacity="0.75"/>
    <!-- Mid cloud -->
    <ellipse cx="115" cy="22" rx="75" ry="24" fill="#c0c8d0" opacity="0.7"/>
    <ellipse cx="125" cy="16" rx="60" ry="22" fill="#d0d8e0" opacity="0.65"/>
    <!-- Upper cloud -->
    <ellipse cx="120" cy="4" rx="45" ry="18" fill="#e0e8f0" opacity="0.6"/>
    <ellipse cx="125" cy="-6" rx="30" ry="14" fill="#eef2f6" opacity="0.55"/>
    <!-- Anvil top -->
    <ellipse cx="130" cy="-14" rx="50" ry="10" fill="#e8ecf0" opacity="0.5"/>
    <ellipse cx="140" cy="-18" rx="40" ry="8" fill="#f0f4f8" opacity="0.4"/>
    <!-- Rain base -->
    <ellipse cx="110" cy="52" rx="110" ry="22" fill="#707880" opacity="0.7"/>
    <ellipse cx="120" cy="58" rx="100" ry="18" fill="#606870" opacity="0.6"/>

    <!-- Lightning bolt -->
    <path d="M160,10 L145,35 L158,35 L140,65 L165,30 L150,30 Z" fill="#ffd54f" opacity="0.8"/>
    <path d="M160,10 L145,35 L158,35 L140,65 L165,30 L150,30 Z" fill="#fff9c4" opacity="0.3"/>

    <!-- Rain drops -->
    <line x1="60" y1="68" x2="55" y2="82" stroke="#4a7a9a" stroke-width="2" opacity="0.6"/>
    <line x1="80" y1="70" x2="75" y2="84" stroke="#4a7a9a" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="68" x2="95" y2="82" stroke="#4a7a9a" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="70" x2="115" y2="84" stroke="#4a7a9a" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="68" x2="135" y2="82" stroke="#4a7a9a" stroke-width="2" opacity="0.6"/>
    <line x1="160" y1="70" x2="155" y2="84" stroke="#4a7a9a" stroke-width="2" opacity="0.6"/>

    <rect x="30" y="88" width="180" height="22" rx="4" fill="#2a2a3a" opacity="0.9"/>
    <text x="120" y="103" text-anchor="middle" fill="white" font-size="14" font-weight="800">Cumulonimbus</text>
    <text x="120" y="122" text-anchor="middle" fill="#90b0c0" font-size="11">⛈️ Thunderstorm / Heavy rain / Hail</text>
  </g>

  <!-- ==================== KEY / LEGEND ==================== -->

  <g transform="translate(50, 755)" filter="url(#softShadow)">
    <rect x="0" y="0" width="800" height="260" rx="14" fill="white"/>
    <rect x="0" y="0" width="800" height="44" rx="14" fill="#1a3a5c"/>
    <rect x="0" y="30" width="800" height="14" fill="#1a3a5c"/>

    <text x="400" y="29" text-anchor="middle" fill="white" font-size="18" font-weight="800" letter-spacing="2">📖 CLOUD CLASSIFICATION GUIDE</text>

    <!-- Shape types -->
    <text x="40" y="72" fill="#1a3a5c" font-size="15" font-weight="700">By Shape:</text>

    <!-- Stratus -->
    <rect x="40" y="84" width="14" height="14" rx="3" fill="#d8dce4" stroke="#b0b8c0" stroke-width="1"/>
    <text x="62" y="96" fill="#333" font-size="13">Stratus — Layered, sheet-like clouds</text>

    <!-- Cumulus -->
    <rect x="40" y="108" width="14" height="14" rx="3" fill="white" stroke="#d0d8e0" stroke-width="1"/>
    <text x="62" y="120" fill="#333" font-size="13">Cumulus — Puffy, heaped clouds</text>

    <!-- Cirrus -->
    <rect x="40" y="132" width="14" height="14" rx="3" fill="#e8ecf0" stroke="#c0c8d0" stroke-width="1"/>
    <text x="62" y="144" fill="#333" font-size="13">Cirrus — Wispy, feathery ice clouds</text>

    <!-- Nimbus -->
    <rect x="40" y="156" width="14" height="14" rx="3" fill="#808890" stroke="#606870" stroke-width="1"/>
    <text x="62" y="168" fill="#333" font-size="13">Nimbus — Rain-bearing clouds</text>

    <!-- Altitude prefixes -->
    <text x="420" y="72" fill="#1a3a5c" font-size="15" font-weight="700">By Altitude:</text>

    <rect x="420" y="84" width="14" height="14" rx="3" fill="#4fc3f7"/>
    <text x="442" y="96" fill="#333" font-size="13">Cirro- (High: 5–13 km)</text>

    <rect x="420" y="108" width="14" height="14" rx="3" fill="#66bb6a"/>
    <text x="442" y="120" fill="#333" font-size="13">Alto- (Mid: 2–7 km)</text>

    <rect x="420" y="132" width="14" height="14" rx="3" fill="#ffa726"/>
    <text x="442" y="144" fill="#333" font-size="13">Strato- (Low: 0–2 km)</text>

    <!-- Combos -->
    <text x="40" y="205" fill="#1a3a5c" font-size="14" font-weight="700">Common Combinations:</text>
    <text x="40" y="228" fill="#555" font-size="12">• Cirrocumulus = High + Heaped</text>
    <text x="40" y="248" fill="#555" font-size="12">• Stratocumulus = Low + Heaped</text>
    <text x="420" y="205" fill="#1a3a5c" font-size="14" font-weight="700">💡 Tip:</text>
    <text x="420" y="228" fill="#555" font-size="12">Clouds with "Nimbo-" or "-nimbus"</text>
    <text x="420" y="248" fill="#555" font-size="12">bring precipitation!</text>
  </g>

  <!-- Footer -->
  <text x="450" y="1040" text-anchor="middle" fill="#8898a0" font-size="11" letter-spacing="1">Clouds are classified by their altitude, shape, and whether they produce precipitation</text>
</svg>
