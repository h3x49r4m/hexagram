h.</text><text x="220" y="140" font-size="12" fill="#8b6914" font-weight="bold">☕ 12-16 oz | 🧊 Smooth</text></g><g transform="translate(250, 780)" filter="url(#shadow)"><rect width="400" height="180" rx="12" fill="#fff" opacity=".9"/><g transform="translate(55, 15)"><path d="M20 30l10 95h70l10-95z" fill="url(#flatwhite)" stroke="#b8a090" stroke-width="1.5"/><ellipse cx="65" cy="30" rx="45" ry="11" fill="#f0e0d0" stroke="#b8a090" stroke-width="1.5"/><rect x="24" y="60" width="82" height="65" fill="#4a2810" rx="2"/><rect x="24" y="40" width="82" height="20" fill="#e8d5c4" rx="2"/><ellipse cx="65" cy="40" rx="38" ry="8" fill="#f5e6d3" opacity=".6"/><path d="M110 50q30 5 30 35 0 25-30 15" fill="none" stroke="#b8a090" stroke-width="4"/></g><text x="210" y="45" font-size="22" font-weight="bold" fill="#3c1a00">Flat White</text><text x="210" y="70" font-size="13" fill="#6f4e37">Espresso with microfoam</text><text x="210" y="90" font-size="13" fill="#6f4e37">(steamed milk with small</text><text x="210" y="110" font-size="13" fill="#6f4e37">bubbles) and no foam layer.</text><text x="210" y="140" font-size="12" fill="#8b6914" font-weight="bold">☕ 6-8 oz | 🫧 Microfoam</text></g><g opacity=".25"><text x="450" y="1180" font-size="11" fill="#3c1a00" text-anchor="middle" font-weight="bold" letter-spacing="1">http://localhost:1234/hexagram/en/gallery/</text></g><rect x="0" y="1170" width="900" height="30" fill="url(#header)" rx="15"/><rect x="0" y="1170" width="900" height="15" fill="url(#header)"/><text x="450" y="1192" font-size="10" fill="#f0e0d0" text-anchor="middle" letter-spacing="2">COFFEE TYPES INFOGRAPHIC • 2026</text><ellipse cx="780" cy="1080" rx="8" ry="12" fill="#5c2e00" opacity=".2" transform="rotate(-30,780,1080)"/><ellipse cx="120" cy="1100" rx="6" ry="9" fill="#5c2e00" opacity=".15" transform="rotate(20,120,1100)"/><ellipse cx="820" cy="1120" rx="5" ry="8" fill="#5c2e00" opacity=".15" transform="rotate(-10,820,1120)"/></svg>