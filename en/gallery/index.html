url(#coffeeMed)"/><rect x="14" y="2" width="82" height="10" rx="4" fill="url(#cremaGrad)"/><rect x="8" y="138" width="92" height="50" rx="16" fill="#FFF" opacity=".75"/><text x="54" y="158" text-anchor="middle" fill="#2C1810" font-size="13" font-weight="800">Affogato</text><text x="54" y="178" text-anchor="middle" fill="#8A7A6A" font-size="10">~4 oz</text><rect x="10" y="192" width="88" height="20" rx="10" fill="#5C2E1A" opacity=".06"/><text x="54" y="206" text-anchor="middle" fill="#5A3A2A" font-size="8" font-weight="700">33% · 67%</text></g><g transform="translate(545, 1406)"><path d="M8 0H112l18 138H-10z" fill="url(#glassGrad)" stroke="#C0B0A0" stroke-width="1.2" filter="url(#shadowMed)"/><path d="M8 0H112l18 138H-10z" fill="url(#glassShine)"/><rect x="10" y="2" width="100" height="55" rx="4" fill="url(#creamGrad)"/><rect x="10" y="57" width="100" height="28" rx="4" fill="url(#whiskeyGrad)"/><rect x="10" y="85" width="100" height="51" rx="4" fill="url(#coffeeMed)"/><rect x="6" y="150" width="108" height="50" rx="16" fill="#FFF" opacity=".75"/><text x="60" y="171" text-anchor="middle" fill="#2C1810" font-size="13" font-weight="800">Irish Coffee</text><text x="60" y="191" text-anchor="middle" fill="#8A7A6A" font-size="10">8 oz</text><rect x="10" y="204" width="100" height="20" rx="10" fill="#5C2E1A" opacity=".06"/><text x="60" y="218" text-anchor="middle" fill="#5A3A2A" font-size="8" font-weight="700">40% · 20% · 40%</text></g><ellipse cx="70" cy="1630" rx="7" ry="4.5" fill="#5C2E1A" opacity=".1" transform="rotate(-20 70 1630)"/><ellipse cx="930" cy="1630" rx="7" ry="4.5" fill="#5C2E1A" opacity=".1" transform="rotate(20 930 1630)"/><ellipse cx="130" cy="1635" rx="5.5" ry="3.5" fill="#5C2E1A" opacity=".06" transform="rotate(10 130 1635)"/><ellipse cx="870" cy="1635" rx="5.5" ry="3.5" fill="#5C2E1A" opacity=".06" transform="rotate(-10 870 1635)"/></svg>

<div id="modal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-box">
        <button class="modal-close">&times;</button>

        <div class="modal-toolbar">
            <button class="toolbar-btn" id="zoomIn" title="Zoom In">+</button>
            <button class="toolbar-btn" id="zoomOut" title="Zoom Out">−</button>
            <button class="toolbar-btn" id="zoomFit" title="Fit">⊡</button>
            <button class="toolbar-btn" id="zoomReset" title="Reset">⟲</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
        </div>

        <div class="modal-viewport" id="viewport">
            <img id="modalImage" src="" alt="SVG Preview" />
        </div>

        <div class="modal-footer">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p id="modalDesc"></p>
                <div id="modalTags" class="modal-tags"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-download" id="downloadBtn">⬇ Download</button>
                <button class="btn-fullscreen" id="fullscreenBtn">⛶ Full</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    
    
    
    const ZOOM_STEP = 0.2;
    const MIN_ZOOM = 0.2;
    const MAX_ZOOM = 5;

    
    
    
    const grid = document.getElementById('galleryGrid');
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const viewport = document.getElementById('viewport');
    const closeBtn = document.querySelector('.modal-close');
    const overlay = document.querySelector('.modal-overlay');
    const titleEl = document.getElementById('modalTitle');
    const descEl = document.getElementById('modalDesc');
    const tagsEl = document.getElementById('modalTags');
    const downloadBtn = document.getElementById('downloadBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const zoomLevel = document.getElementById('zoomLevel');

    
    
    
    let currentData = null;
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;
    let imgWidth = 0;
    let imgHeight = 0;
    let isLoaded = false;

    
    
    
    let observer;
    if ('IntersectionObserver' in window) {
        observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const svgContainer = card.querySelector('.gallery-card-image');
                    if (svgContainer) {
                        
                        const svg = svgContainer.querySelector('svg');
                        if (svg && !svg.dataset.loaded) {
                            svg.dataset.loaded = 'true';
                            
                            svg.style.opacity = '1';
                        }
                    }
                    observer.unobserve(card);
                }
            });
        }, {
            rootMargin: '100px', 
            threshold: 0.01
        });
    }

    
    
    
    const cards = grid ? grid.querySelectorAll('.gallery-card') : [];
    const filterBtns = document.querySelectorAll('.filter-btn');

    
    const cardVisibility = new Map();

    function filterGallery(filter) {
        let visible = false;
        
        cards.forEach(card => {
            const show = filter === 'all' || (card.dataset.tags || '').includes(filter);
            const wasVisible = cardVisibility.get(card) || false;
            
            if (show !== wasVisible) {
                card.style.display = show ? 'flex' : 'none';
                cardVisibility.set(card, show);
            }
            
            if (show) visible = true;
        });

        filterBtns.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === filter);
        });

        
        const old = grid.querySelector('.no-results');
        if (old) old.remove();

        if (!visible) {
            const msg = document.createElement('p');
            msg.className = 'no-results';
            msg.textContent = 'No SVGs found';
            grid.appendChild(msg);
        }
    }

    
    let filterTimeout;
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            clearTimeout(filterTimeout);
            filterTimeout = setTimeout(() => {
                filterGallery(btn.dataset.filter);
            }, 50);
        });
    });

    
    
    
    let transformCache = '';
    
    function updateTransform() {
        if (!isLoaded) return;
        
        const scale = zoom;
        const tx = panX / scale;
        const ty = panY / scale;
        const newTransform = `scale(${scale}) translate(${tx}px, ${ty}px)`;
        
        
        if (newTransform !== transformCache) {
            transformCache = newTransform;
            modalImage.style.transform = newTransform;
            modalImage.style.transformOrigin = 'center center';
            zoomLevel.textContent = Math.round(zoom * 100) + '%';
        }
    }

    
    let zoomTimeout;
    function throttledZoom(fn) {
        return function() {
            if (zoomTimeout) return;
            fn();
            zoomTimeout = setTimeout(() => {
                zoomTimeout = null;
            }, 16);
        };
    }

    const zoomIn = throttledZoom(() => {
        zoom = Math.min(zoom + ZOOM_STEP, MAX_ZOOM);
        updateTransform();
    });

    const zoomOut = throttledZoom(() => {
        zoom = Math.max(zoom - ZOOM_STEP, MIN_ZOOM);
        updateTransform();
    });

    function zoomFit() {
        if (!isLoaded || imgWidth === 0) return;
        const w = viewport.clientWidth - 40;
        const h = viewport.clientHeight - 40;
        const ratio = Math.min(w / imgWidth, h / imgHeight);
        zoom = Math.min(ratio, 1);
        panX = 0;
        panY = 0;
        transformCache = '';
        updateTransform();
    }

    function zoomReset() {
        zoom = 1;
        panX = 0;
        panY = 0;
        transformCache = '';
        updateTransform();
    }

    
    
    
    let preloadImage = new Image();
    let currentSrc = '';

    function openModal(data) {
        currentData = data;
        zoom = 1;
        panX = 0;
        panY = 0;
        isLoaded = false;
        transformCache = '';
        modalImage.style.opacity = '0';

        titleEl.textContent = data.title || 'Untitled';
        descEl.textContent = data.description || '';
        tagsEl.innerHTML = (data.tags || []).map(t => `<span class="modal-tag">${t}</span>`).join('');

        modal.classList.add('active');
        document.body.style.overflow = 'hidden';

        
        if (data.url !== currentSrc) {
            currentSrc = data.url;
            preloadImage = new Image();
            preloadImage.onload = function() {
                imgWidth = this.naturalWidth || 800;
                imgHeight = this.naturalHeight || 600;
                modalImage.src = data.url;
                isLoaded = true;
                modalImage.style.opacity = '1';
                zoomFit();
            };
            preloadImage.onerror = function() {
                const card = document.querySelector(`.gallery-card[data-filename="${data.filename}"]`);
                if (card) {
                    const svg = card.querySelector('.gallery-card-image svg');
                    if (svg) {
                        const svgString = new XMLSerializer().serializeToString(svg);
                        const blob = new Blob([svgString], { type: 'image/svg+xml' });
                        modalImage.src = URL.createObjectURL(blob);
                        isLoaded = true;
                        modalImage.style.opacity = '1';
                        zoomFit();
                    }
                }
            };
            preloadImage.src = data.url;
        }
    }

    function closeModal() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(() => {
            modalImage.src = '';
            isLoaded = false;
            currentSrc = '';
        }, 300);
    }

    
    
    

    
    cards.forEach(card => {
        const svgContainer = card.querySelector('.gallery-card-image');
        if (svgContainer && observer) {
            const svg = svgContainer.querySelector('svg');
            if (svg) {
                svg.style.opacity = '0';
                observer.observe(card);
            }
        }
    });

    cards.forEach(card => {
        card.addEventListener('click', function(e) {
            if (e.target.closest('.tag')) return;
            openModal({
                url: this.dataset.url,
                title: this.dataset.title,
                description: this.dataset.description,
                tags: (this.dataset.tags || '').split(' ').filter(Boolean),
                filename: this.dataset.filename
            });
        });
    });

    
    document.querySelectorAll('.gallery-card .tag').forEach(tag => {
        tag.addEventListener('click', function(e) {
            e.stopPropagation();
            const filter = this.textContent.trim();
            filterBtns.forEach(btn => {
                if (btn.dataset.filter === filter) {
                    filterGallery(filter);
                }
            });
        });
    });

    
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', closeModal);
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
    });

    
    document.getElementById('zoomIn').addEventListener('click', zoomIn);
    document.getElementById('zoomOut').addEventListener('click', zoomOut);
    document.getElementById('zoomFit').addEventListener('click', zoomFit);
    document.getElementById('zoomReset').addEventListener('click', zoomReset);

    
    document.addEventListener('keydown', e => {
        if (!modal.classList.contains('active')) return;
        if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
        if (e.key === '-') { e.preventDefault(); zoomOut(); }
        if (e.key === '0') { e.preventDefault(); zoomFit(); }
    });

    
    viewport.addEventListener('wheel', function(e) {
        if (!isLoaded) return;
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
            e.deltaY < 0 ? zoomIn() : zoomOut();
        } else {
            panY -= e.deltaY * 0.5;
            updateTransform();
        }
    }, { passive: false });

    
    viewport.addEventListener('mousedown', function(e) {
        if (!isLoaded || zoom <= 0.3) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.style.cursor = 'grabbing';
    });

    document.addEventListener('mousemove', function(e) {
        if (!isPanning) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    document.addEventListener('mouseup', function() {
        isPanning = false;
        viewport.style.cursor = 'grab';
    });

    
    let touchStartX = 0, touchStartY = 0;
    let isTouching = false;
    let lastDist = 0;

    viewport.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            isTouching = true;
            touchStartX = e.touches[0].clientX - panX;
            touchStartY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
            const t1 = e.touches[0], t2 = e.touches[1];
            lastDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }
    }, { passive: true });

    viewport.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1 && isTouching) {
            e.preventDefault();
            panX = e.touches[0].clientX - touchStartX;
            panY = e.touches[0].clientY - touchStartY;
            updateTransform();
        } else if (e.touches.length === 2) {
            const t1 = e.touches[0], t2 = e.touches[1];
            const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
            const scale = dist / lastDist;
            zoom = Math.min(Math.max(zoom * scale, MIN_ZOOM), MAX_ZOOM);
            lastDist = dist;
            updateTransform();
        }
    }, { passive: false });

    viewport.addEventListener('touchend', function() {
        isTouching = false;
    }, { passive: true });

    
    downloadBtn.addEventListener('click', function() {
        if (!currentData) return;
        const link = document.createElement('a');
        link.href = currentData.url;
        link.download = currentData.filename || 'gallery.svg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    
    fullscreenBtn.addEventListener('click', function() {
        const box = document.querySelector('.modal-box');
        if (!document.fullscreenElement) {
            box.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    });

    document.addEventListener('fullscreenchange', function() {
        if (document.fullscreenElement) {
            setTimeout(zoomFit, 100);
        }
    });

    
    let resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (modal.classList.contains('active') && isLoaded) {
                zoomFit();
            }
        }, 150);
    });

    
    if (grid) {
        grid.addEventListener('dblclick', () => filterGallery('all'));
    }

    
    filterGallery('all');

    
    window.addEventListener('unload', function() {
        if (observer) {
            observer.disconnect();
        }
    });

})();
